# Houdt het gratis Supabase-project wakker: elke 2 dagen een kleine vraag aan de database.
name: Supabase wakker houden
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Vraag 1 restaurant op
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            'https://jjdqajhetxyiyjqedtcf.supabase.co/rest/v1/restaurants?select=id&limit=1' \
            -H 'apikey: sb_publishable_2VF5lH5fsdoJcgAovLTWNw_M5fqmpt7')
          echo "Status: $code"
          cat /tmp/out.json
          test "$code" = "200"
